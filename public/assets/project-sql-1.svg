  <text x="56" y="142" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">    DATE_TRUNC('month', first_sub) AS cohort_mth,</text>
  <text x="56" y="162" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">    SUM(mrr_amount) AS initial_mrr,</text>
  <text x="56" y="182" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">    COUNT(DISTINCT active_users) AS dau_30d</text>
  <text x="56" y="202" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">  FROM</text>
  <text x="96" y="202" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">subscriptions_log</text>
  <text x="56" y="222" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">  GROUP BY</text>
  <text x="125" y="222" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">1, 2</text>
  <text x="40" y="246" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">), churn_decay AS (</text>
  <text x="56" y="270" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">  SELECT</text>
  <text x="56" y="290" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">    cohort_mth, dau_30d,</text>
  <text x="56" y="310" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-size="11">    CASE WHEN dau_30d &lt; 3 THEN 'High Risk'</text>
  <text x="56" y="330" fill="#14b8a6" font-family="'JetBrains Mono', monospace" font-size="11">         ELSE 'Healthy' END AS risk_tier,</text>
  <text x="56" y="350" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">    PERCENTILE_CONT(0.5) WITHIN GROUP ...</text>
  <text x="40" y="380" fill="#6366f1" font-family="'JetBrains Mono', monospace" font-size="12">SELECT * FROM churn_decay;</text>
