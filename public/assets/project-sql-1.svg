  <rect x="24" y="68" width="370" height="404" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="98" fill="#6366f1" font-family="'JetBrains Mono', monospace" font-size="12">WITH</text>
  <text x="80" y="98" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">monthly_cohorts AS (</text>
  <text x="56" y="122" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">  SELECT</text>
