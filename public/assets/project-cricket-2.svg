<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="12" fill="#090d16"/>
  <rect x="2" y="2" width="796" height="496" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <rect x="0" y="0" width="800" height="48" fill="#0f172a" rx="12 12 0 0"/>
  <text x="28" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">IPL Contextual Matchup &amp; True Impact Analytics</text>
  <text x="650" y="30" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11">Python / Pandas / Seaborn</text>

  <!-- Left: Scatter Plot of True Strike Rate vs Pressure Leverage -->
  <rect x="24" y="68" width="450" height="400" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="98" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Middle Overs (7-14) vs Spin: True SR vs Expected Balls/Boundary</text>
  
  <!-- Coordinate Axis -->
  <line x1="60" y1="410" x2="430" y2="410" stroke="#475569" stroke-width="1.5"/>
  <line x1="60" y1="410" x2="60" y2="120" stroke="#475569" stroke-width="1.5"/>
  <text x="220" y="440" fill="#94a3b8" font-size="10">Expected Boundary Frequency (Balls / 4 or 6)</text>
  <text x="30" y="260" fill="#94a3b8" font-size="10" transform="rotate(-90 30,260)">True Strike Rate Differential</text>

  <!-- Scatter Dots -->
  <circle cx="120" cy="340" r="6" fill="#64748b" opacity="0.7"/>
  <circle cx="160" cy="310" r="5" fill="#64748b" opacity="0.7"/>
  <circle cx="210" cy="280" r="7" fill="#64748b" opacity="0.7"/>
  <circle cx="290" cy="240" r="6" fill="#38bdf8"/>
  <circle cx="340" cy="180" r="9" fill="#10b981"/>
  <circle cx="380" cy="150" r="10" fill="#6366f1"/>

  <text x="380" y="135" fill="#a5b4fc" font-size="10" font-weight="bold">High Leverage Finisher (+28.4 TSR)</text>
  <text x="340" y="165" fill="#6ee7b7" font-size="10" font-weight="bold">Spin Destroyer (+18.2 TSR)</text>

  <!-- Right: Key Analytical Breakdown -->
  <rect x="490" y="68" width="286" height="190" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="506" y="98" fill="#f8fafc" font-size="13" font-weight="600">Model Methodology</text>
  <text x="506" y="128" fill="#cbd5e1" font-size="11">• 250,000+ IPL ball deliveries</text>
  <text x="506" y="152" fill="#cbd5e1" font-size="11">• Adjusted for pitch pace &amp; boundary dimensions</text>
  <text x="506" y="176" fill="#cbd5e1" font-size="11">• Phase-wise win probability added (WPA)</text>
  <text x="506" y="200" fill="#cbd5e1" font-size="11">• Wrist spin vs Finger spin splits</text>

  <rect x="490" y="278" width="286" height="190" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="506" y="308" fill="#f8fafc" font-size="13" font-weight="600">Open-Source Impact</text>
  <text x="506" y="340" fill="#f59e0b" font-size="28" font-weight="700">500+ Stars</text>
  <text x="506" y="368" fill="#cbd5e1" font-size="11">Used by grassroots cricket analysts, tactical coaches, and sports data writers.</text>
  <text x="506" y="420" fill="#38bdf8" font-size="11">Streamlit Interactive Web App Live</text>
</svg>