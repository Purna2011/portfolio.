<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="12" fill="#090d16"/>
  <rect x="2" y="2" width="796" height="496" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <rect x="0" y="0" width="800" height="48" fill="#0f172a" rx="12 12 0 0"/>
  <text x="28" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">SaaS Onboarding Funnel Diagnostics &amp; A/B Experiment Analysis</text>
  
  <!-- Funnel Visual -->
  <g transform="translate(40, 80)">
    <!-- Step 1 -->
    <rect x="0" y="20" width="720" height="45" rx="6" fill="#3b82f6"/>
    <text x="20" y="48" fill="#fff" font-size="13" font-weight="bold">Step 1: Sign Up &amp; Email Verification</text>
    <text x="600" y="48" fill="#fff" font-size="13" font-weight="bold">100% (85,000)</text>

    <!-- Step 2 -->
    <rect x="40" y="80" width="640" height="45" rx="6" fill="#2563eb"/>
    <text x="60" y="108" fill="#fff" font-size="13" font-weight="bold">Step 2: Workspace Creation &amp; Profile Setup</text>
    <text x="600" y="108" fill="#fff" font-size="13" font-weight="bold">82.4% (70,040)</text>

    <!-- Step 3 (The Bottleneck) -->
    <rect x="120" y="140" width="480" height="45" rx="6" fill="#ef4444"/>
    <text x="140" y="168" fill="#fff" font-size="13" font-weight="bold">Step 3: Team Invitation [BEFORE EXPERIMENT]</text>
    <text x="480" y="168" fill="#fff" font-size="13" font-weight="bold">41.0% (34,850)</text>

    <!-- Step 3 (After Experiment) -->
    <rect x="80" y="200" width="560" height="45" rx="6" fill="#10b981"/>
    <text x="100" y="228" fill="#fff" font-size="13" font-weight="bold">Step 3: Contextual Sample Templates [VARIANT B]</text>
    <text x="540" y="228" fill="#fff" font-size="13" font-weight="bold">68.4% (58,140)</text>

    <!-- Step 4 Activation -->
    <rect x="110" y="260" width="500" height="45" rx="6" fill="#059669"/>
    <text x="130" y="288" fill="#fff" font-size="13" font-weight="bold">Step 4: Day-7 Core Action Activation</text>
    <text x="510" y="288" fill="#fff" font-size="13" font-weight="bold">59.2% (50,320)</text>
  </g>

  <!-- Impact Callout -->
  <rect x="40" y="400" width="720" height="60" rx="8" fill="#1e293b"/>
  <text x="60" y="425" fill="#34d399" font-weight="bold" font-size="12">Experiment Result: Variant B won with p &lt; 0.001 significance.</text>
  <text x="60" y="445" fill="#cbd5e1" font-size="11">+27.4% absolute gain in onboarding completion and +11.2% lift in Day-30 customer retention.</text>
</svg>