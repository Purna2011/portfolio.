<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="12" fill="#0b1120"/>
  <rect x="0" y="0" width="800" height="48" fill="#172554" rx="12 12 0 0"/>
  <text x="28" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Power BI Data Model &amp; DAX Calculation Architecture</text>
  
  <g transform="translate(40, 80)">
    <rect x="20" y="20" width="200" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="35" y="48" fill="#93c5fd" font-weight="bold" font-size="12">Fact_SalesOrders</text>
    <text x="35" y="75" fill="#cbd5e1" font-size="11">• OrderID (PK)</text>
    <text x="35" y="95" fill="#cbd5e1" font-size="11">• ProductSKU (FK)</text>
    <text x="35" y="115" fill="#cbd5e1" font-size="11">• WarehouseID (FK)</text>
    <text x="35" y="135" fill="#cbd5e1" font-size="11">• OrderQty, Revenue</text>

    <rect x="280" y="20" width="200" height="150" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="295" y="48" fill="#6ee7b7" font-weight="bold" font-size="12">Dim_InventoryStock</text>
    <text x="295" y="75" fill="#cbd5e1" font-size="11">• ProductSKU (PK)</text>
    <text x="295" y="95" fill="#cbd5e1" font-size="11">• StockOnHand</text>
    <text x="295" y="115" fill="#cbd5e1" font-size="11">• SafetyStockBuffer</text>
    <text x="295" y="135" fill="#cbd5e1" font-size="11">• HoldingUnitCost</text>

    <rect x="540" y="20" width="180" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="555" y="48" fill="#fde68a" font-weight="bold" font-size="12">Dim_Suppliers</text>
    <text x="555" y="75" fill="#cbd5e1" font-size="11">• SupplierID (PK)</text>
    <text x="555" y="95" fill="#cbd5e1" font-size="11">• AvgLeadTimeDays</text>
    <text x="555" y="115" fill="#cbd5e1" font-size="11">• ReliabilityScore</text>
    <text x="555" y="135" fill="#cbd5e1" font-size="11">• RegionCoverage</text>
  </g>

  <!-- DAX Code Snippet Box -->
  <rect x="40" y="260" width="720" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="290" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">DAX MEASURE: Dynamic Reorder Point</text>
  <text x="60" y="320" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">ReorderPoint = </text>
  <text x="80" y="340" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">VAR AvgDailyDemand = AVERAGE(Fact_SalesOrders[OrderQty])</text>
  <text x="80" y="360" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">VAR MaxLeadTime = MAX(Dim_Suppliers[AvgLeadTimeDays])</text>
  <text x="80" y="380" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11">VAR SafetyStock = (MaxLeadTime - AVERAGE(Dim_Suppliers[AvgLeadTimeDays])) * AvgDailyDemand</text>
  <text x="60" y="410" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">RETURN (AvgDailyDemand * AVERAGE(Dim_Suppliers[AvgLeadTimeDays])) + SafetyStock</text>
</svg>