<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" rx="12" fill="#0b1120"/>
  <rect x="2" y="2" width="796" height="496" rx="10" fill="none" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Power BI Header -->
  <rect x="0" y="0" width="800" height="48" fill="#172554" rx="12 12 0 0"/>
  <rect x="20" y="12" width="24" height="24" rx="4" fill="#f59e0b"/>
  <text x="26" y="28" font-family="sans-serif" font-weight="900" font-size="14" fill="#000">BI</text>
  <text x="56" y="30" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Enterprise Supply Chain &amp; Multi-Regional Inventory Analytics</text>
  <text x="670" y="30" fill="#93c5fd" font-family="sans-serif" font-size="11">Data Refreshed: Today 06:00</text>

  <!-- 4 KPI Cards -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="175" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" fill="#94a3b8" font-size="11">ORDER FULFILLMENT RATE</text>
    <text x="14" y="58" fill="#10b981" font-size="24" font-weight="700">96.8%</text>
    <text x="96" y="58" fill="#34d399" font-size="11">▲ +7.6% MoM</text>

    <rect x="190" y="0" width="175" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="204" y="24" fill="#94a3b8" font-size="11">STOCKOUT INCIDENTS</text>
    <text x="204" y="58" fill="#38bdf8" font-size="24" font-weight="700">14</text>
    <text x="240" y="58" fill="#38bdf8" font-size="11">▼ -68% YoY</text>

    <rect x="380" y="0" width="175" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="394" y="24" fill="#94a3b8" font-size="11">INVENTORY HOLDING COST</text>
    <text x="394" y="58" fill="#f59e0b" font-size="24" font-weight="700">$1.18M</text>
    <text x="480" y="58" fill="#fbbf24" font-size="11">▼ -19.2%</text>

    <rect x="570" y="0" width="180" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="584" y="24" fill="#94a3b8" font-size="11">ACTIVE SKUs MONITORED</text>
    <text x="584" y="58" fill="#e2e8f0" font-size="24" font-weight="700">4,520</text>
    <text x="660" y="58" fill="#94a3b8" font-size="11">8 Warehouses</text>
  </g>

  <!-- Main Chart Section: Stockout Risk by Region vs Lead Time -->
  <rect x="24" y="168" width="480" height="300" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="40" y="196" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Regional Stock Levels vs Dynamic Safety Reorder Buffer</text>
  <!-- Bar Chart Visual -->
  <g transform="translate(40, 220)">
    <!-- Hub 1 -->
    <text x="0" y="20" fill="#cbd5e1" font-size="11">North Hub</text>
    <rect x="80" y="6" width="220" height="18" rx="3" fill="#38bdf8"/>
    <line x1="330" y1="2" x2="330" y2="28" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="340" y="20" fill="#94a3b8" font-size="10">Safety: 3,200</text>

    <!-- Hub 2 -->
    <text x="0" y="60" fill="#cbd5e1" font-size="11">South Hub</text>
    <rect x="80" y="46" width="310" height="18" rx="3" fill="#10b981"/>
    <line x1="330" y1="42" x2="330" y2="68" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Hub 3 -->
    <text x="0" y="100" fill="#cbd5e1" font-size="11">West Hub</text>
    <rect x="80" y="86" width="180" height="18" rx="3" fill="#f59e0b"/>
    <line x1="330" y1="82" x2="330" y2="108" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Hub 4 -->
    <text x="0" y="140" fill="#cbd5e1" font-size="11">East Hub</text>
    <rect x="80" y="126" width="290" height="18" rx="3" fill="#38bdf8"/>
    <line x1="330" y1="122" x2="330" y2="148" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Hub 5 -->
    <text x="0" y="180" fill="#cbd5e1" font-size="11">Central Hub</text>
    <rect x="80" y="166" width="350" height="18" rx="3" fill="#10b981"/>
    <line x1="330" y1="162" x2="330" y2="188" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>
  </g>

  <!-- Right Chart: Lead Time Distribution -->
  <rect x="520" y="168" width="256" height="300" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="536" y="196" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Supplier Variance (DAX)</text>
  <circle cx="648" cy="290" r="65" fill="none" stroke="#1e293b" stroke-width="24"/>
  <circle cx="648" cy="290" r="65" fill="none" stroke="#38bdf8" stroke-width="24" stroke-dasharray="260 410"/>
  <circle cx="648" cy="290" r="65" fill="none" stroke="#10b981" stroke-width="24" stroke-dasharray="100 410" stroke-dashoffset="-260"/>
  <text x="648" y="295" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">84%</text>
  <text x="648" y="315" fill="#94a3b8" font-size="10" text-anchor="middle">On-Time Deliveries</text>
  <text x="536" y="420" fill="#cbd5e1" font-size="11">• Fast Turn (&lt;3d): 62%</text>
  <text x="536" y="442" fill="#cbd5e1" font-size="11">• Lead Variance &gt;5d: 16%</text>
</svg>